<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #f5f5f7; --muted: #a1a1a6; --line: rgba(255,255,255,0.14); --link: #c39bff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 24px; }
  h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin-bottom: 20px; }
  ul { list-style: none; }
  a.app { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line);
          border-radius: 16px; color: var(--fg); text-decoration: none; }
  a.app:hover { border-color: var(--link); }
  a.app:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
  a.app img { width: 48px; height: 48px; border-radius: 11px; }
  a.app strong { display: block; }
  a.app span { color: var(--muted); font-size: 0.92rem; }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <ul>
    <li>
      <a class="app" href="reverb/">
        <img src="reverb/icon.png" width="48" height="48" alt="">
        <div><strong>Reverb</strong><span>A retro music player for iPhone</span></div>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
